# staticcheck configuration.
#
# The §9 merge gate of the OBSRVR Engineering Standard requires `staticcheck` or
# `golangci-lint` to pass before a merge. staticcheck is the one wired into CI and
# into `make lint`.
#
# Everything is enabled except the exclusions below. Each exclusion is a backlog
# item, not a permanent opinion: they exist so the gate can be switched on now and
# catch every *new* problem, rather than waiting until the existing ones are cleared.

checks = [
    "all",

    # -- Enabled-by-default style checks we deliberately do not want --------------

    # ST1000: every package needs a package comment. Worth doing, but it would
    # mean touching ~20 packages in the same change that turns the gate on.
    # Tracked as GAP-24.
    "-ST1000",

    # ST1003: naming conventions. The generated protobuf code and the existing
    # config structs use names this flags, and renaming an exported config field
    # is a contract change (VER-3), not a lint fix.
    "-ST1003",

    # -- Backlog: real findings in code this branch does not touch ---------------

    # SA1019: use of deprecated identifiers. All current hits are
    # grpc.DialContext/grpc.WithBlock, which NewClient replaces. The migration is
    # not mechanical — NewClient never blocks, so the call sites that rely on
    # WithBlock change behaviour — and it needs its own change with its own tests.
    # Tracked as GAP-25.
    "-SA1019",
]

# Only report problems in code we own. Generated protobuf is checked by buf.
initialisms = ["API", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS",
               "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH",
               "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI", "URL",
               "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "SIP", "RTP", "AMQP",
               "DB", "TS", "CUE", "DAG", "XDR", "CAP", "SEP", "NDJSON", "OSC"]
