version: v2

modules:
  - path: .

lint:
  use:
    - STANDARD
  except:
    # The four rules below all demand renaming existing messages or services,
    # which changes their fully-qualified names on the wire and breaks every
    # deployed component — the same migration deferred in ADR 0002, and they
    # should be done in it rather than piecemeal.
    #
    # RPC_REQUEST_STANDARD_NAME / RPC_RESPONSE_STANDARD_NAME want
    # <Method>Request / <Method>Response. flowctl's RPCs take and return
    # domain messages (Event, RawLedger, SinkAck).
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # RPC_REQUEST_RESPONSE_UNIQUE forbids sharing a message between RPCs;
    # Ping/Shutdown deliberately share Empty, Pong and ShutdownRequest across
    # the source, processor and sink services.
    - RPC_REQUEST_RESPONSE_UNIQUE
    # SERVICE_SUFFIX wants every service named *Service.
    - SERVICE_SUFFIX
    # ENUM_ZERO_VALUE_SUFFIX wants *_UNSPECIFIED; RunStatus, ChunkStatus and
    # FailureClass use *_UNKNOWN. The binary encoding is unaffected (zero is
    # still zero) but the Go constant and the JSON name both change, so it
    # breaks source compatibility for flowctl-sdk consumers. Same migration,
    # same ADR.
    - ENUM_ZERO_VALUE_SUFFIX
    # flowctl's protobuf package is `flowctl`, not `flowctl.v1`. Renaming it
    # changes the fully-qualified name of every message and the gRPC path of
    # every method, breaking every deployed component and every build of
    # flowctl-sdk at once. The rename is correct and is a release blocker for
    # 1.0; it is deferred deliberately, with the exception recorded under
    # CONF-1 in docs/adr/0002-defer-protobuf-package-versioning.md.
    - PACKAGE_VERSION_SUFFIX
    # Directory structure is expected to match the package name, which the
    # same rename would fix. Same ADR, same expiry.
    - PACKAGE_DIRECTORY_MATCH

breaking:
  use:
    - FILE
