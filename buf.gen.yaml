version: v2

# Mirrors the protoc invocation in the Makefile's `generate` target, so code
# generated by buf is byte-identical to code generated by protoc. DATA-5 requires
# generated copies of a schema to be regenerated and checked in CI, never
# hand-edited.
managed:
  enabled: false

plugins:
  - remote: buf.build/protocolbuffers/go
    out: .
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: .
    opt:
      - paths=source_relative
